# デスクトップアプリは webkit2gtk 等のシステムライブラリを要求するため
# ルートのワークスペースから切り離してある（ビルド方法は apps/desktop/README.md）
[workspace]

[package]
name = "img-watercolor-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "img-watercolor デスクトップアプリ（Tauri）"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
painterly-core = { path = "../../../crates/painterly-core" }
painterly-depth = { path = "../../../crates/painterly-depth" }
painterly-face = { path = "../../../crates/painterly-face" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
