<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>img-watercolor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside id="sidebar">
    <h1>img-watercolor</h1>
    <div class="buttons">
      <button id="btn-open">画像を開く</button>
      <button id="btn-render" disabled>レンダリング</button>
    </div>

    <div class="group">
      <label>採色解像度 <span id="v-pixels">96</span>px
        <input type="range" id="p-pixels" min="32" max="256" step="8" value="96" />
      </label>
      <label>キャンバス解像度 <span id="v-resolution">360</span>px
        <input type="range" id="p-resolution" min="120" max="720" step="20" value="360" />
      </label>
      <label>減色数 <span id="v-palette">36</span>
        <input type="range" id="p-palette" min="8" max="96" step="2" value="36" />
      </label>
      <label>減色前ぼかし σ <span id="v-posterize_blur">2.0</span>
        <input type="range" id="p-posterize_blur" min="0" max="6" step="0.5" value="2" />
      </label>
      <label>勾配ぼかし σ <span id="v-normal_blur">8.0</span>
        <input type="range" id="p-normal_blur" min="1" max="20" step="0.5" value="8" />
      </label>
      <label>ブラシ半径 <span id="v-brush_size">15</span>px
        <input type="range" id="p-brush_size" min="4" max="40" step="1" value="15" />
      </label>
      <label>ストローク密度 <span id="v-strokes_scale">1.0</span>×
        <input type="range" id="p-strokes_scale" min="0.5" max="2" step="0.1" value="1" />
      </label>
      <label>ウェット混色 <span id="v-wet">0.18</span>
        <input type="range" id="p-wet" min="0" max="0.5" step="0.02" value="0.18" />
      </label>
      <label>彩度 <span id="v-saturation">1.15</span>×
        <input type="range" id="p-saturation" min="0.8" max="1.6" step="0.05" value="1.15" />
      </label>
      <label>出力長辺 <span id="v-out_long">1080</span>px
        <input type="range" id="p-out_long" min="480" max="2160" step="40" value="1080" />
      </label>
    </div>

    <div class="group">
      <label class="row">ハードブラシ
        <select id="p-hard_brush">
          <option selected>triangle</option><option>flat</option><option>soft</option>
          <option>oil</option><option>pastel</option><option>charcoal</option>
        </select>
      </label>
      <label class="row">スタンダード
        <select id="p-standard_brush">
          <option>triangle</option><option selected>flat</option><option>soft</option>
          <option>oil</option><option>pastel</option><option>charcoal</option>
        </select>
      </label>
      <label class="row">ソフトブラシ
        <select id="p-soft_brush">
          <option>triangle</option><option>flat</option><option selected>soft</option>
          <option>oil</option><option>pastel</option><option>charcoal</option>
        </select>
      </label>
      <label class="row">色空間
        <select id="p-color_space"><option selected>rgb</option><option>lab</option></select>
      </label>
      <label class="row">シード
        <input type="number" id="p-seed" value="42" min="0" step="1" />
      </label>
    </div>

    <div class="buttons">
      <button id="btn-process" disabled>過程を再生</button>
      <button id="btn-save" disabled>画像を保存</button>
    </div>

    <div id="status">画像をドラッグ＆ドロップするか「画像を開く」</div>
    <progress id="progress" max="1" value="0"></progress>
  </aside>

  <main id="main">
    <div id="preview-wrap">
      <img id="preview" alt="" />
      <div id="drop-hint">ここに画像をドロップ</div>
    </div>
    <div id="stages"></div>
  </main>

  <script src="main.js"></script>
</body>
</html>
