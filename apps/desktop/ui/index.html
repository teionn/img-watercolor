<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>img-watercolor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside id="sidebar">
    <h1>img-watercolor</h1>
    <div class="buttons">
      <button id="btn-open">画像を開く</button>
      <button id="btn-render" disabled>レンダリング</button>
    </div>

    <div class="group">
      <label class="row">プリセット
        <select id="preset-select" title=""></select>
      </label>
      <label class="row" title="パラメータを変えると自動で再レンダリングします">自動プレビュー
        <input type="checkbox" id="auto-preview" />
      </label>
      <button id="btn-reset" class="mini" title="全パラメータを既定値（プリセット「基本」）に戻す">すべて既定値に戻す</button>
    </div>

    <details class="group" open>
      <summary>基本</summary>
      <label>元絵への忠実度 <span id="v-color_fidelity">0.50</span>
        <input type="range" id="p-color_fidelity" min="0" max="1" step="0.05" value="0.5" />
      </label>
      <label>減色数 <span id="v-palette">36</span>
        <input type="range" id="p-palette" min="8" max="96" step="2" value="36" />
      </label>
      <label>キャンバス解像度 <span id="v-resolution">360</span>px
        <input type="range" id="p-resolution" min="120" max="720" step="20" value="360" />
      </label>
      <label>ストローク密度 <span id="v-strokes_scale">1.0</span>×
        <input type="range" id="p-strokes_scale" min="0.5" max="2" step="0.1" value="1" />
      </label>
      <label>ウェット混色 <span id="v-wet">0.18</span>
        <input type="range" id="p-wet" min="0" max="0.5" step="0.02" value="0.18" />
      </label>
      <label>彩度 <span id="v-saturation">1.15</span>×
        <input type="range" id="p-saturation" min="0.8" max="1.6" step="0.05" value="1.15" />
      </label>
      <label>明るさ（ウォッシュ） <span id="v-lightness">1.00</span>
        <input type="range" id="p-lightness" min="0.7" max="2.2" step="0.05" value="1" />
      </label>
    </details>

    <details class="group" open>
      <summary>細部・人物（顔向け）</summary>
      <label>細部保持（平坦部で短く） <span id="v-detail_retention">0.40</span>
        <input type="range" id="p-detail_retention" min="0" max="1" step="0.05" value="0.4" />
      </label>
      <label>細部の輝度を戻す <span id="v-detail_overlay">0.00</span>
        <input type="range" id="p-detail_overlay" min="0" max="1" step="0.05" value="0" />
      </label>
      <label title="先にプレビュー上で顔をクリックしてフォーカス位置を指定してください">フォーカス部を強化（要クリック） <span id="v-focus_detail">0.00</span>
        <input type="range" id="p-focus_detail" min="0" max="1" step="0.05" value="0" />
      </label>
      <label class="row" title="UltraFace (ONNX) で顔を自動検出し、顔領域のディテールを強化します">顔を検出して強化
        <input type="checkbox" id="p-use_face" />
      </label>
      <label title="顔検出時のディテール強化の強さ（0 でも検出時は自動で 0.6 になります）">顔ディテール強化 <span id="v-face_detail">0.00</span>
        <input type="range" id="p-face_detail" min="0" max="1" step="0.05" value="0" />
      </label>
      <div id="face-model-state" class="hint"></div>
    </details>

    <details class="group" open>
      <summary>ブラシ（密度カーブ）</summary>
      <p class="curve-note">横軸 = 密度（左：平坦な面 → 右：輪郭・細部）。点をドラッグで調整、空白クリックで点を追加、点をダブルクリックで削除。</p>
      <div class="curve-block">
        <div class="curve-cap"><span>太さ</span><span id="curve-size-val" class="curve-val"></span></div>
        <canvas id="curve-size" class="curve"></canvas>
      </div>
      <div class="curve-block">
        <div class="curve-cap"><span>長さ</span><span id="curve-length-val" class="curve-val"></span></div>
        <canvas id="curve-length" class="curve"></canvas>
      </div>
      <label class="row">ハードブラシ（輪郭・高密度）
        <select id="p-hard_brush">
          <option selected>triangle</option><option>flat</option><option>soft</option>
          <option>oil</option><option>pastel</option><option>charcoal</option><option>wash</option><option>bleed</option><option>drybrush</option><option>pencil</option><option>impasto</option><option value="__custom__">PNG を選択…</option>
        </select>
      </label>
      <label class="row">スタンダード（中密度）
        <select id="p-standard_brush">
          <option>triangle</option><option selected>flat</option><option>soft</option>
          <option>oil</option><option>pastel</option><option>charcoal</option><option>wash</option><option>bleed</option><option>drybrush</option><option>pencil</option><option>impasto</option><option value="__custom__">PNG を選択…</option>
        </select>
      </label>
      <label class="row">ソフトブラシ（広い面）
        <select id="p-soft_brush">
          <option>triangle</option><option>flat</option><option selected>soft</option>
          <option>oil</option><option>pastel</option><option>charcoal</option><option>wash</option><option>bleed</option><option>drybrush</option><option>pencil</option><option>impasto</option><option value="__custom__">PNG を選択…</option>
        </select>
      </label>
    </details>

    <details class="group">
      <summary>奥行き / フォーカス <span id="focus-state">（プレビューをクリックで焦点指定）</span></summary>
      <label>奥行きディテール <span id="v-depth_detail">0.50</span>
        <input type="range" id="p-depth_detail" min="0" max="1" step="0.05" value="0.5" />
      </label>
      <label>フォーカス範囲 <span id="v-focus_range">0.60</span>
        <input type="range" id="p-focus_range" min="0.05" max="1" step="0.05" value="0.6" />
      </label>
      <label>粗さ下限（ボケ側） <span id="v-detail_min">0.35</span>
        <input type="range" id="p-detail_min" min="0.1" max="1" step="0.05" value="0.35" />
      </label>
      <label>細かさ上限（焦点側） <span id="v-detail_max">1.15</span>
        <input type="range" id="p-detail_max" min="1" max="1.6" step="0.05" value="1.15" />
      </label>
      <label>フォーカス深度（クリック未指定時） <span id="v-focus_depth">0.00</span>
        <input type="range" id="p-focus_depth" min="0" max="1" step="0.05" value="0" />
      </label>
      <label class="row">奥行き反転
        <input type="checkbox" id="p-depth_invert" />
      </label>
      <label class="row" title="Depth Anything V2 (ONNX) で高精度な深度を推定します">ニューラル深度
        <input type="checkbox" id="p-use_depth" />
      </label>
      <div class="file-row">
        <button id="btn-depth-file" class="mini">外部デプス PNG…</button>
        <span id="depth-file-name" class="file-name"></span>
        <button id="btn-depth-clear" class="mini" hidden>✕</button>
      </div>
      <div id="depth-model-state" class="hint"></div>
    </details>

    <details class="group">
      <summary>線 / 紙 / 水彩</summary>
      <label>輪郭線の濃さ <span id="v-line_strength">0.40</span>
        <input type="range" id="p-line_strength" min="0" max="1" step="0.05" value="0.4" />
      </label>
      <label>輪郭線の太さ <span id="v-line_width">1.0</span>px
        <input type="range" id="p-line_width" min="0.3" max="3" step="0.1" value="1" />
      </label>
      <label class="row" title="線の色の作り方。下地の色を拾って暗くします">線の合成
        <select id="p-line_blend">
          <option selected value="multiply">乗算</option>
          <option value="softlight">ソフトライト</option>
          <option value="overlay">オーバーレイ</option>
          <option value="hardlight">ハードライト</option>
          <option value="graphite">グラファイト（固定色）</option>
        </select>
      </label>
      <label>線のトーン <span id="v-line_tone">0.30</span>
        <input type="range" id="p-line_tone" min="0.05" max="0.7" step="0.05" value="0.3" />
      </label>
      <label>透明水彩 <span id="v-pigment">0.00</span>
        <input type="range" id="p-pigment" min="0" max="1" step="0.05" value="0" />
      </label>
      <label>エッジ濃縮 <span id="v-edge_darken">0.00</span>
        <input type="range" id="p-edge_darken" min="0" max="1" step="0.05" value="0" />
      </label>
      <label>紙の質感 <span id="v-paper_texture">0.35</span>
        <input type="range" id="p-paper_texture" min="0" max="1" step="0.05" value="0.35" />
      </label>
      <label>紙の余白 <span id="v-paper_border">0.00</span>
        <input type="range" id="p-paper_border" min="0" max="0.12" step="0.005" value="0" />
      </label>
    </details>

    <details class="group">
      <summary>詳細</summary>
      <label>採色解像度 <span id="v-pixels">96</span>px
        <input type="range" id="p-pixels" min="32" max="256" step="8" value="96" />
      </label>
      <label>減色前ぼかし σ <span id="v-posterize_blur">2.0</span>
        <input type="range" id="p-posterize_blur" min="0" max="6" step="0.5" value="2" />
      </label>
      <label>勾配ぼかし σ <span id="v-normal_blur">8.0</span>
        <input type="range" id="p-normal_blur" min="1" max="20" step="0.5" value="8" />
      </label>
      <label>出力長辺 <span id="v-out_long">1080</span>px
        <input type="range" id="p-out_long" min="480" max="2160" step="40" value="1080" />
      </label>
      <label>ハード刷り分け分位数 <span id="v-hard_quantile">0.85</span>
        <input type="range" id="p-hard_quantile" min="0.5" max="0.99" step="0.01" value="0.85" />
      </label>
      <label>スタンダード分位数 <span id="v-standard_quantile">0.55</span>
        <input type="range" id="p-standard_quantile" min="0.2" max="0.9" step="0.01" value="0.55" />
      </label>
      <label>横取り採色率 <span id="v-side_sample_prob">0.30</span>
        <input type="range" id="p-side_sample_prob" min="0" max="1" step="0.05" value="0.3" />
      </label>
      <label class="row">色空間
        <select id="p-color_space"><option selected>rgb</option><option>lab</option></select>
      </label>
      <label class="row">シード
        <input type="number" id="p-seed" value="42" min="0" step="1" />
      </label>
      <label class="row" title="一筆ごとの描画過程を GIF に書き出します（レンダリングが少し遅くなります）">過程 GIF を生成
        <input type="checkbox" id="p-process_gif" />
      </label>
    </details>

    <div class="buttons">
      <button id="btn-process" disabled>過程を再生</button>
      <button id="btn-save" disabled>画像を保存</button>
      <button id="btn-save-gif" disabled>GIF</button>
    </div>

    <div id="status">画像をドラッグ＆ドロップするか「画像を開く」</div>
    <progress id="progress" max="1" value="0"></progress>
  </aside>

  <main id="main">
    <div id="preview-wrap">
      <img id="preview" alt="" />
      <div id="focus-marker"></div>
      <div id="drop-hint">ここに画像をドロップ</div>
    </div>
    <div id="stages"></div>
  </main>

  <script src="main.js"></script>
</body>
</html>
