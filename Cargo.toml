[workspace]
resolver = "2"
# デスクトップアプリ (apps/desktop/src-tauri) は webkit2gtk 等のシステムライブラリを
# 要求するため独立ワークスペースにしてある。ビルドは apps/desktop/ 側で行う
members = [
    "crates/painterly-core",
    "crates/painterly-cli",
]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"

# デバッグビルドでも画像処理が現実的な速度で動くように最適化を上げる
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
