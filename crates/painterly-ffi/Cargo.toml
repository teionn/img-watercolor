[package]
name = "painterly-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "painterly-core の UniFFI バインディング（iOS / Swift 向け）"

[lib]
name = "painterly_ffi"
# staticlib: iOS 実機/シミュレータ用、cdylib: バインディング生成（--library モード）用
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
painterly-core = { path = "../painterly-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
uniffi = "0.29"
thiserror = "2"
