[package]
name = "painterly-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "painterly-core のコマンドラインフロントエンド（run.py 相当）"

[[bin]]
name = "painterly"
path = "src/main.rs"

[dependencies]
painterly-core = { path = "../painterly-core" }
painterly-depth = { path = "../painterly-depth" }
painterly-face = { path = "../painterly-face" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
clap = { version = "4", features = ["derive"] }
